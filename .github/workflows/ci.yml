name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Agent Unit Tests & Leak Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Check for non-public index URLs in tracked files
        run: |
          if git grep -E "airlock-proxy\.uplink\.goog|google3" -- ':!.github/workflows/ci.yml'; then
            echo "ERROR: Found non-public URL or path reference in tracked files."
            exit 1
          fi

      - name: Validate shell scripts syntax
        run: |
          bash -n setup.sh run.sh deploy.sh teardown.sh

      - name: Sync & test agent package
        run: |
          uv sync --frozen
          uv run --frozen pytest
